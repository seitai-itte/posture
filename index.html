<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B5C6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="姿勢比較">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>姿勢比較</title>
<style>
:root {
  --bg: #ffffff;
  --frame: #f2f4f4;
  --fg: #1e1e1e;
  --muted: #6b7471;
  --line: #dde2e1;
  --accent: #3B5C6A;
  --plumb: #19c37d;
  --font: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 760px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { min-height: 36px; padding: 0 14px; border: 0; background: #fff; color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.opts { display: flex; flex-direction: column; }
.optrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.optrow:last-child { border-bottom: 1px solid var(--line); }
.optrow .seg button { min-height: 34px; padding: 0 12px; }

.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 0; }
.col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.col .btns { width: 100%; padding: 0 4px; }
.col[data-k="a"] .frame { border-radius: 8px 0 0 8px; align-self: flex-end; }
.col[data-k="b"] .frame { border-radius: 0 8px 8px 0; align-self: flex-start; }
.frame { position: relative; width: 100%; background: var(--frame); border-radius: 8px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.frame img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; pointer-events: none; -webkit-user-drag: none; }
.frame .grid { position: absolute; inset: 0; pointer-events: none; }
.frame .plumb { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; margin-left: -0.5px; background: var(--plumb); pointer-events: none; }
.frame .lbl { position: absolute; top: 8px; left: 8px; padding: 0 7px; border-radius: 3px; background: rgba(30,30,30,0.62); color: #fff; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; line-height: 1.7; pointer-events: none; }
.frame .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; pointer-events: none; }
.frame .st { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #fff; font-size: 11.5px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events: none; }

.pickrow { display: grid; grid-template-columns: 1.6fr 1fr; gap: 8px; }
.btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btn { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: default; }

.result { display: flex; flex-direction: column; gap: 8px; }
.result img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
.hint { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="app">
  <div class="top"><h1>姿勢比較</h1></div>

  <div class="pair">
    <div class="col" data-k="a">
      <div class="frame">
        <span class="empty">写真なし</span>
        <img alt="" hidden>
        <div class="grid"></div>
        <span class="plumb"></span>
        <span class="lbl">Before</span>
        <span class="st" aria-live="polite"></span>
      </div>
    </div>
    <div class="col" data-k="b">
      <div class="frame">
        <span class="empty">写真なし</span>
        <img alt="" hidden>
        <div class="grid"></div>
        <span class="plumb"></span>
        <span class="lbl">After</span>
        <span class="st" aria-live="polite"></span>
      </div>
    </div>
  </div>
  <div class="pickrow">
    <button class="btn primary" type="button" id="pickBtn">写真を2枚選ぶ</button>
    <button class="btn" type="button" id="swapBtn">左右を入れ替え</button>
  </div>
  <input type="file" accept="image/*" multiple id="pickInput" hidden>
  <p class="hint">写真はドラッグで移動、2本指（パソコンはホイール）で拡大。ダブルタップで最初の位置に戻ります。</p>

  <section class="opts" aria-label="表示と保存の設定">
    <div class="optrow">
      <span id="sizeLbl">保存サイズ</span>
      <div class="seg" id="sizeSeg" role="group" aria-labelledby="sizeLbl">
        <button type="button" data-r="p34" aria-pressed="true">3:4</button>
        <button type="button" data-r="square" aria-pressed="false">1:1</button>
      </div>
    </div>
    <div class="optrow">
      <span id="gridLbl">網目</span>
      <div class="seg" id="gridSeg" role="group" aria-labelledby="gridLbl">
        <button type="button" data-g="0" aria-pressed="true">なし</button>
        <button type="button" data-g="1" aria-pressed="false">粗い</button>
        <button type="button" data-g="2" aria-pressed="false">細かい</button>
      </div>
    </div>
    <div class="optrow">
      <span id="lblLbl">Before / After の文字</span>
      <div class="seg" id="lblSeg" role="group" aria-labelledby="lblLbl">
        <button type="button" data-l="1" aria-pressed="true">あり</button>
        <button type="button" data-l="0" aria-pressed="false">なし</button>
      </div>
    </div>
  </section>

  <button class="btn primary" type="button" id="makeBtn" disabled>1枚の画像にする</button>
  <div class="result" id="result" hidden>
    <img id="out" alt="Before/Afterを並べた画像">
    <p class="hint">画像を長押しして保存します（パソコンは右クリック）。</p>
  </div>
</main>

<script>
(function () {
  /* 網目：枠の横幅を何マスに割るか（縦は 3:4 で正方形になる数） */
  var GRID = [0, 6, 12];
  var GLW = 0.35; /* 網目の線の太さ（画面のpx）。書き出しも同じ見え方になる */
  var MAX_S = 6;
  /* 保存サイズ：全体の幅×高さ。Before/After を左右に半分ずつ並べる */
  var SIZES = { p34: [1080, 1440], square: [1080, 1080] };
  var state = { grid: 0, ratio: 'p34', label: 1 };
  function panelAspect() { var z = SIZES[state.ratio]; return (z[0] / 2) / z[1]; }
  var slots = { a: { label: 'Before' }, b: { label: 'After' } };
  
  function $(s, r) { return (r || document).querySelector(s); }
  function col(k) { return $('.col[data-k="' + k + '"]'); }

  /* ---------- 写真の位置と拡大 ----------
     s：枠に収まる大きさを1とした倍率、tx/ty：枠の幅・高さに対するずれ（中央基準） */
  function fit(sl, fw, fh) {
    var c = Math.max(fw / sl.iw, fh / sl.ih) * sl.s;
    var dw = sl.iw * c, dh = sl.ih * c;
    return { c: c, dw: dw, dh: dh, x: fw / 2 + sl.tx * fw - dw / 2, y: fh / 2 + sl.ty * fh - dh / 2 };
  }
  function homePos(sl) {
    sl.s = 1; sl.ty = 0;
    if (sl.ax == null) { sl.tx = 0; return; }
    /* 足首が中央の縦線に乗るように横にずらす */
    var f = col('a').querySelector('.frame'), fw = f.clientWidth || 3, fh = f.clientHeight || 4;
    var c = Math.max(fw / sl.iw, fh / sl.ih);
    sl.tx = -(sl.ax - 0.5) * sl.iw * c / fw;
  }
  /* 写真の端が枠の内側に入らないよう、端でピタッと止める */
  function clampPos(sl, fw, fh) {
    if (sl.s < 1) sl.s = 1;
    var g = fit(sl, fw, fh);
    var mx = Math.max(0, (g.dw - fw) / 2 / fw), my = Math.max(0, (g.dh - fh) / 2 / fh);
    sl.tx = Math.min(mx, Math.max(-mx, sl.tx));
    sl.ty = Math.min(my, Math.max(-my, sl.ty));
  }
  function apply(k) {
    var sl = slots[k], f = col(k).querySelector('.frame'), img = f.querySelector('img');
    if (!sl.img) return;
    clampPos(sl, f.clientWidth, f.clientHeight);
    var g = fit(sl, f.clientWidth, f.clientHeight);
    img.style.width = sl.iw + 'px'; img.style.height = sl.ih + 'px';
    img.style.transform = 'translate(' + g.x + 'px,' + g.y + 'px) scale(' + g.c + ')';
  }

  /* ---------- 枠の大きさ：保存サイズと同じ形で、画面に収まる最大 ---------- */
  function sizeFrames() {
    var a = panelAspect();
    var maxW = $('.pair').clientWidth / 2, maxH = Math.max(320, window.innerHeight * 0.75);
    var w = Math.min(maxW, maxH * a), h = w / a;
    document.querySelectorAll('.frame').forEach(function (f) { f.style.width = w + 'px'; f.style.height = h + 'px'; });
  }
  document.querySelectorAll('#sizeSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.ratio = b.getAttribute('data-r');
      document.querySelectorAll('#sizeSeg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      sizeFrames();
      ['a', 'b'].forEach(function (k) { var sl = slots[k]; if (!sl.img) return; if (!sl.moved) homePos(sl); else sl.s = clampS(sl.s, sl); apply(k); });
      drawGridCss();
      $('#result').hidden = true;
    });
  });

  /* ---------- 網目 ---------- */
  function drawGridCss() {
    var n = GRID[state.grid];
    document.querySelectorAll('.frame').forEach(function (f) {
      var g = f.querySelector('.grid');
      if (!n) { g.style.backgroundImage = 'none'; return; }
      var cell = f.clientWidth / n;
      var ln = 'rgba(255,255,255,0.6)';
      g.style.backgroundImage =
        'linear-gradient(to right, ' + ln + ' ' + GLW + 'px, transparent ' + GLW + 'px),' +
        'linear-gradient(to bottom, ' + ln + ' ' + GLW + 'px, transparent ' + GLW + 'px)';
      g.style.backgroundSize = cell + 'px ' + cell + 'px';
      g.style.backgroundPosition = '0 0';
      g.style.boxShadow = 'inset 0 0 0 0 transparent';
    });
  }
  document.querySelectorAll('#gridSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.grid = +b.getAttribute('data-g');
      document.querySelectorAll('#gridSeg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      drawGridCss();
    });
  });

  /* ---------- Before / After の表示 ---------- */
  function applyLabel() {
    document.querySelectorAll('.frame .lbl').forEach(function (l) { l.hidden = !state.label; });
  }
  document.querySelectorAll('#lblSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.label = +b.getAttribute('data-l');
      document.querySelectorAll('#lblSeg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      applyLabel();
      $('#result').hidden = true;
    });
  });

  /* ---------- 写真を入れる ---------- */
  function setStatus(k, t) { col(k).querySelector('.st').textContent = t; }
  function updateMake() { $('#makeBtn').disabled = !(slots.a.img && slots.b.img); }

  function setPhoto(k, file) {
    if (!file || !/^image\//.test(file.type)) return;
    var sl = slots[k], c = col(k), img = c.querySelector('img');
    sl.file = file;
    if (sl.url) URL.revokeObjectURL(sl.url);
    sl.url = URL.createObjectURL(file);
    sl.img = null; sl.ax = null;
    var tok = sl.tok = (sl.tok || 0) + 1;
    $('#result').hidden = true;
    var im = new Image(); im.src = sl.url;
    im.decode().then(function () {
      if (tok !== sl.tok) return;
      sl.img = im; sl.iw = im.naturalWidth; sl.ih = im.naturalHeight;
      homePos(sl);
      img.src = sl.url; img.hidden = false;
      c.querySelector('.empty').hidden = true;
      apply(k); updateMake();
    }).catch(function () { setStatus(k, 'この画像は読み込めませんでした'); });
    sl.moved = false;
  }

  /* ---------- ドラッグ・ピンチ・ホイール ---------- */
  function minS(sl) { return 1; }
  function clampS(s, sl) { return Math.min(MAX_S, Math.max(minS(sl), s)); }
  function zoomAt(k, ns, px, py) {
    var sl = slots[k], f = col(k).querySelector('.frame'), fw = f.clientWidth, fh = f.clientHeight;
    ns = clampS(ns, sl);
    var r = ns / sl.s;
    /* 指の位置(px,py)が同じ場所を指したままになるように */
    var cx = fw / 2 + sl.tx * fw, cy = fh / 2 + sl.ty * fh;
    cx = px + (cx - px) * r; cy = py + (cy - py) * r;
    sl.s = ns; sl.tx = (cx - fw / 2) / fw; sl.ty = (cy - fh / 2) / fh;
    sl.moved = true; apply(k);
  }

  ['a', 'b'].forEach(function (k) {
    var c = col(k), f = c.querySelector('.frame'), sl = slots[k];
    var pts = {}, last = null, lastTap = 0;
    function pos(e) { var r = f.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function pair() {
      var ids = Object.keys(pts); if (ids.length < 2) return null;
      var a = pts[ids[0]], b = pts[ids[1]];
      return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    f.addEventListener('pointerdown', function (e) {
      if (!sl.img) return;
      f.setPointerCapture(e.pointerId);
      pts[e.pointerId] = pos(e);
      last = pair() || pts[e.pointerId];
      var now = Date.now();
      if (Object.keys(pts).length === 1 && now - lastTap < 300) { sl.moved = false; homePos(sl); apply(k); }
      lastTap = now;
    });
    f.addEventListener('pointermove', function (e) {
      if (!pts[e.pointerId] || !sl.img) return;
      pts[e.pointerId] = pos(e);
      var fw = f.clientWidth, fh = f.clientHeight, p = pair();
      if (p) {
        if (last && last.d) {
          sl.tx += (p.x - last.x) / fw; sl.ty += (p.y - last.y) / fh;
          zoomAt(k, sl.s * p.d / last.d, p.x, p.y);
        }
        last = p;
      } else {
        var q = pts[e.pointerId];
        if (last) { sl.tx += (q.x - last.x) / fw; sl.ty += (q.y - last.y) / fh; sl.moved = true; apply(k); }
        last = { x: q.x, y: q.y };
      }
    });
    function up(e) { delete pts[e.pointerId]; var ids = Object.keys(pts); last = ids.length ? pts[ids[0]] : null; }
    f.addEventListener('pointerup', up);
    f.addEventListener('pointercancel', up);
    f.addEventListener('wheel', function (e) {
      if (!sl.img) return;
      e.preventDefault();
      var p = pos(e);
      zoomAt(k, sl.s * Math.exp(-e.deltaY * 0.0015), p.x, p.y);
    }, { passive: false });
  });

  /* ---------- 写真を選ぶ：2枚いっぺんに（1枚目→Before、2枚目→After） ---------- */
  var pickInput = $('#pickInput');
  $('#pickBtn').addEventListener('click', function () { pickInput.click(); });
  pickInput.addEventListener('change', function () {
    var fs = Array.prototype.slice.call(pickInput.files || []);
    pickInput.value = '';
    if (!fs.length) return;
    if (fs.length >= 2) { setPhoto('a', fs[0]); setPhoto('b', fs[1]); return; }
    setPhoto(!slots.a.url ? 'a' : (!slots.b.url ? 'b' : 'a'), fs[0]);
  });
  $('#swapBtn').addEventListener('click', function () {
    var fa = slots.a.file, fb = slots.b.file;
    if (fa) setPhoto('b', fa);
    if (fb) setPhoto('a', fb);
  });

  window.addEventListener('resize', function () { sizeFrames(); apply('a'); apply('b'); drawGridCss(); });

  /* ---------- 書き出し：画面と同じ見え方で Before / After を横に並べる ---------- */
  $('#makeBtn').addEventListener('click', function () {
    var Z = SIZES[state.ratio], W = Z[0] / 2, H = Z[1];
    var cv = document.createElement('canvas');
    cv.width = Z[0]; cv.height = Z[1];
    var c = cv.getContext('2d');
    var font = getComputedStyle(document.body).fontFamily;
    ['a', 'b'].forEach(function (k, i) {
      var sl = slots[k], x = i * W, y = 0;
      c.save();
      c.beginPath(); c.rect(x, y, W, H); c.clip();
      c.fillStyle = '#f2f4f4'; c.fillRect(x, y, W, H);
      var g = fit(sl, W, H);
      c.drawImage(sl.img, x + g.x, y + g.y, g.dw, g.dh);
      var n = GRID[state.grid];
      if (n) {
        var cell = W / n;
        c.fillStyle = 'rgba(255,255,255,0.6)';
        /* 画面の0.5pxと同じ見え方になるよう、画面の枠の幅に対する比率で太さを決める */
        var lw = GLW * W / (col(k).querySelector('.frame').clientWidth || W);
        for (var gx = 0; gx <= W + 0.5; gx += cell) c.fillRect(x + gx, y, lw, H);
        for (var gy = 0; gy <= H + 0.5; gy += cell) c.fillRect(x, y + gy, W, lw);
      }
      c.fillStyle = '#19c37d'; c.fillRect(x + W / 2 - 1, y, 2, H);
      if (state.label) {
        c.font = '600 22px ' + font;
        var tw = c.measureText(sl.label).width;
        c.fillStyle = 'rgba(30,30,30,0.62)'; c.fillRect(x + 16, y + 16, tw + 22, 36);
        c.fillStyle = '#ffffff'; c.textBaseline = 'middle'; c.fillText(sl.label, x + 27, y + 35);
      }
      c.restore();
    });
    $('#out').src = cv.toDataURL('image/jpeg', 0.92);
    $('#result').hidden = false;
  });

  sizeFrames();
  drawGridCss();
  applyLabel();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>

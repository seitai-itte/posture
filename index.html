<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B5C6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="姿勢比較">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ビフォーアフター比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 1 column work surface (max 760px). Stage first, per-photo inputs and measurements aligned under the two frame columns, then adjustments and export. */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --fg: #1b2422;
  --muted: #5a6763;
  --line: #cfd7d4;
  --accent: #176a62;
  --accent-fg: #ffffff;
  --frame: #dfe5e2;
  --mark: #ff5a36;
  --font-display: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-body: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101514;
    --surface: #18201e;
    --fg: #e4ebe9;
    --muted: #8fa09b;
    --line: #2b3733;
    --accent: #5ec2b6;
    --accent-fg: #0b1a18;
    --frame: #202a28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101514;
  --surface: #18201e;
  --fg: #e4ebe9;
  --muted: #8fa09b;
  --line: #2b3733;
  --accent: #5ec2b6;
  --accent-fg: #0b1a18;
  --frame: #202a28;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 36px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.head { display: flex; flex-direction: column; gap: 2px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.04em;
}
.note, .hint { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.6; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.checks { display: inline-flex; gap: 4px 18px; flex-wrap: wrap; }
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface);
}
.seg button {
  min-height: 40px;
  padding: 0 14px;
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Stage */
.stage { --pos: 50%; }
.stage.side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stage.slide {
  position: relative;
  aspect-ratio: var(--ar);
  border-radius: 6px;
  overflow: hidden;
  background: var(--frame);
}
.frame {
  position: relative;
  overflow: hidden;
  min-width: 0;
  background: var(--frame);
  border-radius: 6px;
  aspect-ratio: var(--ar);
}
.frame[data-has="1"] { cursor: grab; touch-action: none; }
.frame[data-has="1"]:active { cursor: grabbing; }
.stage.side .frame.active { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage.slide .frame { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.stage.slide .frame.b { clip-path: inset(0 0 0 var(--pos)); }
.ph {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform-origin: 50% 50%;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
.empty {
  position: absolute;
  inset: 6px;
  display: grid;
  place-items: center;
  padding: 8px;
  border: 2px dashed var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
.cap, .tag, .sd {
  position: absolute;
  max-width: calc(100% - 16px);
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(16, 21, 20, 0.72);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.6;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
}
.cap { top: 8px; left: 8px; }
.tag { top: 34px; left: 8px; font-weight: 500; background: rgba(255, 255, 255, 0.82); color: #1b2422; }
.stage.slide .frame.b .cap, .stage.slide .frame.b .tag { left: auto; right: 8px; }
.sd { bottom: 8px; min-width: 30px; text-align: center; }
.sd.l { left: 8px; }
.sd.r { right: 8px; }
.stage.slide .sd, .sd[hidden] { display: none; }

.grid {
  position: absolute;
  inset: 0;
  display: none;
  pointer-events: none;
  opacity: 0.85;
  background-image:
    linear-gradient(to right, transparent calc(50% - 1px), var(--mark) calc(50% - 1px), var(--mark) calc(50% + 1px), transparent calc(50% + 1px)),
    linear-gradient(to bottom, transparent calc(25% - 0.5px), var(--mark) calc(25% - 0.5px), var(--mark) calc(25% + 0.5px), transparent calc(25% + 0.5px)),
    linear-gradient(to bottom, transparent calc(50% - 0.5px), var(--mark) calc(50% - 0.5px), var(--mark) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
    linear-gradient(to bottom, transparent calc(75% - 0.5px), var(--mark) calc(75% - 0.5px), var(--mark) calc(75% + 0.5px), transparent calc(75% + 0.5px));
}
.stage.grid-on .grid { display: block; }

/* 検査の点と線（SVG）。点だけがドラッグを受ける */
.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.ov [data-pt] { pointer-events: all; cursor: move; }

.divider { display: none; }
.stage.slide .divider {
  display: block;
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--pos);
  width: 44px;
  margin-left: -22px;
  z-index: 3;
  cursor: ew-resize;
  touch-action: none;
}
.divider::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  margin-left: -1px;
  background: #fff;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.28);
}
.knob {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 36px;
  height: 36px;
  margin: -18px 0 0 -18px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
  display: grid;
  place-items: center;
}

/* Per-photo inputs */
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slot { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot label, .slot .lb { color: var(--muted); font-size: 12px; }
.txt {
  width: 100%;
  min-width: 0;
  height: 42px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-size: 16px;
}
.txt::placeholder { color: var(--muted); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn {
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 700; }
.vseg { display: flex; }
.vseg button { flex: 1; padding: 0 4px; }
.st { margin: 0; min-height: 3.2em; color: var(--muted); font-size: 12px; line-height: 1.6; }
.meas { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; padding: 10px; background: var(--surface); border-radius: 8px; min-width: 0; }
.meas:empty { display: none; }
.meas .k { color: var(--muted); }
.meas .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; min-width: 0; }

/* Panels */
.panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rl { width: 3.6em; color: var(--muted); font-size: 13px; }
.row input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
output { min-width: 3.6em; text-align: right; font-variant-numeric: tabular-nums; }
.btnrow .btn { flex: 1; min-width: 130px; }
.out {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: 6px;
}
.result { display: flex; flex-direction: column; gap: 8px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px);
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  border-radius: 8px;
  background: var(--fg);
  color: var(--bg);
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<main class="app">
  <header class="head">
    <h1>ビフォーアフター比較</h1>
    <p class="note">写真はこの端末の中だけで処理します。どこにも送信されません。</p>
  </header>

  <div class="bar">
    <div class="seg" id="modeSeg" role="group" aria-label="表示のしかた">
      <button type="button" data-mode="side" aria-pressed="true">横並び</button>
      <button type="button" data-mode="slide" aria-pressed="false">スライダー</button>
    </div>
    <div class="checks">
      <label class="check"><input type="checkbox" id="ovToggle" checked> 縦線</label>
      <label class="check"><input type="checkbox" id="gridToggle"> 補助線</label>
    </div>
  </div>

  <div id="stage" class="stage side">
    <div class="frame a" data-k="a">
      <img class="ph" alt="" hidden>
      <button class="empty" type="button" hidden>写真を追加</button>
      <div class="grid"></div>
      <svg class="ov" aria-hidden="true"></svg>
      <span class="cap"></span>
      <span class="tag" hidden>サンプル</span>
      <span class="sd l" hidden></span><span class="sd r" hidden></span>
    </div>
    <div class="frame b" data-k="b">
      <img class="ph" alt="" hidden>
      <button class="empty" type="button" hidden>写真を追加</button>
      <div class="grid"></div>
      <svg class="ov" aria-hidden="true"></svg>
      <span class="cap"></span>
      <span class="tag" hidden>サンプル</span>
      <span class="sd l" hidden></span><span class="sd r" hidden></span>
    </div>
    <div class="divider" id="divider" role="slider" tabindex="0" aria-label="境目の位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <span class="knob">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 2 10l5 5V5zm6 0v10l5-5-5-5z" fill="#1b2422"/></svg>
      </span>
    </div>
  </div>
  <p class="hint" id="hint"></p>

  <div class="slots">
    <div class="slot" data-k="a">
      <label for="nameA">左の名前</label>
      <input class="txt name" id="nameA" type="text" value="ビフォー" maxlength="20" autocomplete="off">
      <div class="btns">
        <button class="btn" type="button" data-role="shoot">撮影</button>
        <button class="btn" type="button" data-role="pick">選ぶ</button>
      </div>
      <input class="txt paste" type="text" placeholder="ここに貼り付け" aria-label="左の写真を貼り付ける" autocomplete="off">
      <input type="file" accept="image/*" capture="environment" data-role="cam" hidden>
      <input type="file" accept="image/*" data-role="file" hidden>
      <span class="lb">写真の向き</span>
      <div class="seg vseg" role="group" aria-label="左の写真の向き">
        <button type="button" data-v="front" aria-pressed="true">正面</button>
        <button type="button" data-v="back" aria-pressed="false">背面</button>
        <button type="button" data-v="side" aria-pressed="false">側面</button>
      </div>
      <button class="btn primary" type="button" data-role="auto">自動で点を置く</button>
      <p class="st" aria-live="polite"></p>
      <div class="meas"></div>
    </div>
    <div class="slot" data-k="b">
      <label for="nameB">右の名前</label>
      <input class="txt name" id="nameB" type="text" value="アフター" maxlength="20" autocomplete="off">
      <div class="btns">
        <button class="btn" type="button" data-role="shoot">撮影</button>
        <button class="btn" type="button" data-role="pick">選ぶ</button>
      </div>
      <input class="txt paste" type="text" placeholder="ここに貼り付け" aria-label="右の写真を貼り付ける" autocomplete="off">
      <input type="file" accept="image/*" capture="environment" data-role="cam" hidden>
      <input type="file" accept="image/*" data-role="file" hidden>
      <span class="lb">写真の向き</span>
      <div class="seg vseg" role="group" aria-label="右の写真の向き">
        <button type="button" data-v="front" aria-pressed="true">正面</button>
        <button type="button" data-v="back" aria-pressed="false">背面</button>
        <button type="button" data-v="side" aria-pressed="false">側面</button>
      </div>
      <button class="btn primary" type="button" data-role="auto">自動で点を置く</button>
      <p class="st" aria-live="polite"></p>
      <div class="meas"></div>
    </div>
  </div>
  <p class="hint" id="measNote">数値は、足の中央を通る緑の垂直線を基準にしています。ずれは「目から足首までの長さ」に対する割合です。写真の撮り方で変わるので、同じ位置・距離から撮った写真どうしで比べてください。</p>

  <section class="panel" aria-labelledby="adjH">
    <h2 id="adjH">調整</h2>
    <div class="row">
      <span class="rl">対象</span>
      <div class="seg" id="targetSeg" role="group" aria-label="調整する写真">
        <button type="button" data-k="a" aria-pressed="true">左</button>
        <button type="button" data-k="b" aria-pressed="false">右</button>
      </div>
    </div>
    <div class="row">
      <label class="rl" for="zoom">拡大</label>
      <input type="range" id="zoom" min="50" max="500" step="1" value="100">
      <output id="zoomOut" for="zoom">100%</output>
    </div>
    <div class="row">
      <span class="rl">縦横比</span>
      <div class="seg" id="arSeg" role="group" aria-label="縦横比">
        <button type="button" data-ar="3:4" aria-pressed="true">3:4</button>
        <button type="button" data-ar="9:16" aria-pressed="false">9:16</button>
        <button type="button" data-ar="1:1" aria-pressed="false">1:1</button>
      </div>
    </div>
    <div class="row btnrow">
      <button class="btn" type="button" id="resetBtn">位置と拡大を戻す</button>
      <button class="btn" type="button" id="swapBtn">左右を入れ替え</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="saveH">
    <h2 id="saveH">保存</h2>
    <button class="btn primary" type="button" id="makeBtn">並べた1枚の画像にする</button>
    <div class="result" id="result" hidden>
      <img class="out" id="out" alt="並べた比較画像">
      <p class="hint">画像を長押しして保存します（パソコンは右クリック）。</p>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="pose-core.js"></script>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };
  var AR = { '3:4': [3, 4], '9:16': [9, 16], '1:1': [1, 1] };
  var FONT = "'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif";
  var SIDE = { a: '左', b: '右' };
  var TF_URL = 'tf.min.js';

  /* 点の番号：0鼻 1左目 2右目 3左耳 4右耳 5左肩 6右肩 7左肘 8右肘 9左手首 10右手首 11左腰 12右腰 13左膝 14右膝 15左足首 16右足首
     「左・右」は写真の人物から見た左右。正面から撮ると、人物の左は画像の右側に写る。 */
  var CHAIN = { L: [3, 5, 11, 13, 15], R: [4, 6, 12, 14, 16] };

  function sampleSrc(good) {
    var sl = good ? 130 : 142, sr = good ? 130 : 118, hx = good ? 150 : 164, hy = good ? 72 : 80;
    var c = '#5f6f6a';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">' +
      '<rect width="300" height="400" fill="#e3e8e6"/><rect y="374" width="300" height="26" fill="#cdd5d2"/>' +
      '<line x1="' + hx + '" y1="98" x2="150" y2="' + ((sl + sr) / 2) + '" stroke="' + c + '" stroke-width="16" stroke-linecap="round"/>' +
      '<circle cx="' + hx + '" cy="' + hy + '" r="26" fill="' + c + '"/>' +
      '<polygon points="94,' + sl + ' 206,' + sr + ' 190,252 110,252" fill="' + c + '"/>' +
      '<line x1="92" y1="' + (sl + 8) + '" x2="84" y2="234" stroke="' + c + '" stroke-width="14" stroke-linecap="round"/>' +
      '<line x1="208" y1="' + (sr + 8) + '" x2="216" y2="234" stroke="' + c + '" stroke-width="14" stroke-linecap="round"/>' +
      '<rect x="112" y="250" width="34" height="126" rx="6" fill="' + c + '"/>' +
      '<rect x="154" y="250" width="34" height="126" rx="6" fill="' + c + '"/></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function sampleKp(good) {
    var sl = good ? 130 : 142, sr = good ? 130 : 118, hx = good ? 150 : 164, hy = good ? 72 : 80;
    var P = function (x, y) { return { x: x / 300, y: y / 400, s: 0.9 }; };
    return [
      P(hx, hy), P(hx + 9, hy - 4), P(hx - 9, hy - 4), P(hx + 24, hy + 2), P(hx - 24, hy + 2),
      P(200, sr + 4), P(100, sl + 4), P(212, 190), P(88, 190), P(216, 234), P(84, 234),
      P(170, 252), P(130, 252), P(171, 314), P(129, 314), P(171, 372), P(129, 372)
    ];
  }
  /* 検出できなかったときの目安の位置（全身が中央に立つ想定） */
  function templateKp() {
    var P = function (x, y) { return { x: x, y: y, s: 0.5 }; };
    return [
      P(0.5, 0.12), P(0.53, 0.11), P(0.47, 0.11), P(0.57, 0.125), P(0.43, 0.125),
      P(0.63, 0.25), P(0.37, 0.25), P(0.66, 0.38), P(0.34, 0.38), P(0.66, 0.5), P(0.34, 0.5),
      P(0.57, 0.5), P(0.43, 0.5), P(0.57, 0.72), P(0.43, 0.72), P(0.57, 0.9), P(0.43, 0.9)
    ];
  }

  function newSlot(good) {
    return { src: sampleSrc(good), owned: false, s: 1, x: 0, y: 0, sample: true, iw: 300, ih: 400,
      kp: sampleKp(good), view: 'front', chain: 'L', facing: 'right', status: 'sample', tok: 0 };
  }
  var state = {
    mode: 'side', grid: false, show: true, ar: '3:4', active: 'a', pos: 50,
    slots: { a: newSlot(false), b: newSlot(true) }
  };

  var stage = $('#stage'), divider = $('#divider'), zoom = $('#zoom'), zoomOut = $('#zoomOut');
  var toastEl = $('#toast'), toastTimer = null;
  var frames = {}, slotEls = {};

  /* ---------- 座標：画像(0〜1) ⇄ 枠の中のpx ---------- */

  /* ---------- 検査の図形（SVGと書き出しで共通） ---------- */

      D = pts;
      px = pts[4].x;
    } else {

      line(e1, e2); line(s1, s2); line(h1, h2); line(s1, h1); line(s2, h2);
      line(h1, k1); line(k1, a1); line(h2, k2); line(k2, a2);
      D = [e1, e2, s1, s2, h1, h2, k1, k2, a1, a2];
      px = (a1.x + a2.x) / 2;
    }
    return { lines: L, dots: D, plumb: px, h: M.h };
  }

  function renderOverlay(k) {
    var f = frames[k], sl = state.slots[k], svg = f.ov;

  /* ---------- 計測 ---------- */

  function tiltText(pl, pr, iw, ih) {

  }
  function offText(dxPct, pos, neg) {

    return (dxPct > 0 ? pos : neg) + ' ' + Math.abs(dxPct).toFixed(1) + '%';
  }
  function measure(sl) {
    var kp = sl.kp; if (!kp) return [];
    var iw = sl.iw, ih = sl.ih, rows = [];
    if (sl.view === 'side') {
      var ids = CHAIN[sl.chain], a = kp[ids[4]], ear = kp[ids[0]];
      var H = Math.max(Math.abs(a.y - ear.y) * ih, 1);
      var fr = sl.facing === 'right';
      [['耳', 0], ['肩', 1], ['股関節', 2], ['膝', 3]].forEach(function (r) {
        var p = kp[ids[r[1]]], d = (p.x - a.x) * iw / H * 100;

    } else {
      var ea = { x: (kp[1].x + kp[2].x) / 2, y: (kp[1].y + kp[2].y) / 2 };
      var an = { x: (kp[15].x + kp[16].x) / 2, y: (kp[15].y + kp[16].y) / 2 };
      var H2 = Math.max(Math.abs(an.y - ea.y) * ih, 1);

      var mid = function (i, j) { return { x: (kp[i].x + kp[j].x) / 2, y: (kp[i].y + kp[j].y) / 2 }; };

      rows.push(['肩の傾き', tiltText(kp[5], kp[6], iw, ih)]);
      rows.push(['骨盤の傾き', tiltText(kp[11], kp[12], iw, ih)]);
      rows.push(['頭のずれ', offText((ea.x - an.x) * iw / H2 * 100, pos, neg)]);
      rows.push(['肩のずれ', offText((mid(5, 6).x - an.x) * iw / H2 * 100, pos, neg)]);

  /* ---------- 写真を入れる ---------- */

    applyTransform(state.active); renderOverlay(state.active);
  });
  $('#resetBtn').addEventListener('click', function () {
    var sl = state.slots[state.active];
    sl.s = 1; sl.x = 0; sl.y = 0;
    applyTransform(state.active); syncZoom(); renderOverlay(state.active);
  });
  $('#swapBtn').addEventListener('click', function () {
    var a = state.slots.a, b = state.slots.b;
    ['src', 'owned', 's', 'x', 'y', 'sample', 'iw', 'ih', 'kp', 'view', 'chain', 'facing', 'status'].forEach(function (p) { var t = a[p]; a[p] = b[p]; b[p] = t; });
    a.tok++; b.tok++;
    render();
    ['a', 'b'].forEach(function (k) { if (state.slots[k].status === 'busy') autoPlace(k); });
    toast('写真を入れ替えました');
  });

  /* ---------- 書き出し ---------- */
  function drawGrid(c, x, y, W, H) {
    c.save();
    c.strokeStyle = 'rgba(255,90,54,0.85)';
    c.lineWidth = 3;
    c.beginPath(); c.moveTo(x + W / 2, y); c.lineTo(x + W / 2, y + H); c.stroke();
    c.lineWidth = 2;
    [0.25, 0.5, 0.75].forEach(function (t) {
      c.beginPath(); c.moveTo(x, y + H * t); c.lineTo(x + W, y + H * t); c.stroke();
    });
    c.restore();
  }
  function drawOverlay(c, sl, x, y, W, H) {
    var M = mapper(W, H, sl.iw, sl.ih, sl.s, sl.x, sl.y);
    var gm = shapes(sl, { h: H, fwd: function (u, v) { var q = M.fwd(u, v); return [x + q[0], y + q[1]]; } });
    c.save();
    c.beginPath(); c.rect(x, y, W, H); c.clip();
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 8;
    c.beginPath(); c.moveTo(gm.plumb, y); c.lineTo(gm.plumb, y + H); c.stroke();
    c.strokeStyle = '#19c37d'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(gm.plumb, y); c.lineTo(gm.plumb, y + H); c.stroke();
    c.restore();
    var t = sideLabels(sl);
    c.save();
    c.font = '700 30px ' + FONT; c.textBaseline = 'middle'; c.textAlign = 'center';
    [[t[0], x + 20 + 28], [t[1], x + W - 20 - 28]].forEach(function (r) {
      c.fillStyle = 'rgba(16,21,20,0.72)';
      c.beginPath(); c.roundRect ? c.roundRect(r[1] - 28, y + H - 60, 56, 44, 8) : c.rect(r[1] - 28, y + H - 60, 56, 44); c.fill();
      c.fillStyle = '#fff'; c.fillText(r[0], r[1], y + H - 38);
    });
    c.restore();
  }

  async function make() {
    var btn = $('#makeBtn');
    btn.disabled = true;
    try {
      var W = 900, H = Math.round(W * AR[state.ar][1] / AR[state.ar][0]);
      var pad = 28, gap = 24, strip = 104;
      var cv = document.createElement('canvas');
      cv.width = pad * 2 + W * 2 + gap;
      cv.height = pad * 2 + H + strip;
      var c = cv.getContext('2d');
      c.fillStyle = '#ffffff';
      c.fillRect(0, 0, cv.width, cv.height);
      var keys = ['a', 'b'];
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i], sl = state.slots[k], img = frames[k].img;
        var x = pad + i * (W + gap), y = pad;
        c.save();
        c.beginPath(); c.rect(x, y, W, H); c.clip();
        c.fillStyle = '#e3e8e6'; c.fillRect(x, y, W, H);
        if (sl.src) {
          try { await img.decode(); } catch (err) {}
          if (img.naturalWidth) {
            var cs = Math.max(W / img.naturalWidth, H / img.naturalHeight) * sl.s;
            var dw = img.naturalWidth * cs, dh = img.naturalHeight * cs;
            c.drawImage(img, x + (W - dw) / 2 + sl.x * W, y + (H - dh) / 2 + sl.y * H, dw, dh);
          }
        }
        if (state.grid) drawGrid(c, x, y, W, H);
        c.restore();
        if (state.show && sl.kp && sl.src) drawOverlay(c, sl, x, y, W, H);
        var text = slotEls[k].el.querySelector('.name').value;
        var size = 44;
        c.font = '700 ' + size + 'px ' + FONT;
        while (c.measureText(text).width > W - 24 && size > 20) { size -= 2; c.font = '700 ' + size + 'px ' + FONT; }
        c.fillStyle = '#1b2422';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(text, x + W / 2, y + H + strip / 2);
      }
      $('#out').src = cv.toDataURL('image/jpeg', 0.92);
      $('#result').hidden = false;
      $('#result').scrollIntoView({ block: 'nearest' });
    } catch (err) {
      toast('画像を作れませんでした。別の写真でもう一度お試しください');
    }
    btn.disabled = false;
  }
  $('#makeBtn').addEventListener('click', make);

  render();
})();
</script>

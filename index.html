<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B5C6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="姿勢比較">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>姿勢比較</title>
<style>
:root {
  --bg: #ffffff;
  --frame: #f2f4f4;
  --fg: #1e1e1e;
  --muted: #6b7471;
  --line: #dde2e1;
  --accent: #3B5C6A;
  --plumb: #19c37d;
  --font: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 760px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }

.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; aspect-ratio: 3 / 4; background: var(--frame); border-radius: 8px; overflow: hidden; }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.frame .plumb { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--plumb); box-shadow: 0 0 0 1px rgba(0,0,0,0.18); }
.frame .lbl { position: absolute; top: 10px; left: 10px; padding: 2px 10px; border-radius: 4px; background: rgba(30,30,30,0.72); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
.frame .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
.frame .st { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }

.btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btn { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: default; }

.result { display: flex; flex-direction: column; gap: 8px; }
.result img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<main class="app">
  <h1>姿勢比較</h1>

  <div class="pair">
    <div class="col" data-k="a">
      <div class="frame">
        <span class="empty">写真なし</span>
        <img alt="" hidden>
        <span class="plumb" hidden></span>
        <span class="lbl">Before</span>
        <span class="st" aria-live="polite"></span>
      </div>
      <div class="btns">
        <button class="btn" type="button" data-role="shoot">撮影</button>
        <button class="btn" type="button" data-role="pick">選ぶ</button>
      </div>
      <input type="file" accept="image/*" capture="environment" data-role="cam" hidden>
      <input type="file" accept="image/*" data-role="file" hidden>
    </div>
    <div class="col" data-k="b">
      <div class="frame">
        <span class="empty">写真なし</span>
        <img alt="" hidden>
        <span class="plumb" hidden></span>
        <span class="lbl">After</span>
        <span class="st" aria-live="polite"></span>
      </div>
      <div class="btns">
        <button class="btn" type="button" data-role="shoot">撮影</button>
        <button class="btn" type="button" data-role="pick">選ぶ</button>
      </div>
      <input type="file" accept="image/*" capture="environment" data-role="cam" hidden>
      <input type="file" accept="image/*" data-role="file" hidden>
    </div>
  </div>

  <button class="btn primary" type="button" id="makeBtn" disabled>1枚の画像にする</button>
  <div class="result" id="result" hidden>
    <img id="out" alt="Before/Afterを並べた画像">
    <p class="hint">画像を長押しして保存します（パソコンは右クリック）。</p>
  </div>
</main>

<script src="pose-core.js"></script>
<script>
(function () {
  var slots = { a: { label: 'Before' }, b: { label: 'After' } };
  var tfPromise = null, modelPromise = null, jobs = Promise.resolve();

  function loadTf() {
    if (!tfPromise) {
      tfPromise = new Promise(function (res, rej) {
        var s = document.createElement('script');
        s.src = 'tf.min.js'; s.onload = res;
        s.onerror = function () { tfPromise = null; rej(new Error('tfjs')); };
        document.head.appendChild(s);
      });
    }
    return tfPromise;
  }
  function ensureModel() {
    if (!modelPromise) {
      modelPromise = loadTf().then(function () {
        return Promise.all([
          fetch('movenet-lightning.json').then(function (r) { if (!r.ok) throw new Error('model'); return r.json(); }),
          fetch('movenet-lightning.bin').then(function (r) { if (!r.ok) throw new Error('model'); return r.arrayBuffer(); })
        ]).then(function (a) { return window.PoseCore.init(a[0], a[1]); });
      }).catch(function (e) { modelPromise = null; throw e; });
    }
    return modelPromise;
  }

  /* 縦線の位置（画像の横方向 0〜1）：正面・背面は両足首の中央、側面は見えている側の足首 */
  function plumbX(kp) {
    var la = kp[15], ra = kp[16];
    if (la.s < 0.15 && ra.s < 0.15) return null;
    var shoulderW = Math.abs(kp[5].x - kp[6].x);
    var torso = Math.abs((kp[11].y + kp[12].y) / 2 - (kp[5].y + kp[6].y) / 2);
    var side = shoulderW / Math.max(torso, 0.001) < 0.45;
    if (side || la.s < 0.15 || ra.s < 0.15) return la.s >= ra.s ? la.x : ra.x;
    return (la.x + ra.x) / 2;
  }

  function col(k) { return document.querySelector('.col[data-k="' + k + '"]'); }

  function placeLine(k) {
    var sl = slots[k], c = col(k), f = c.querySelector('.frame'), line = c.querySelector('.plumb');
    if (sl.px == null || !sl.iw) { line.hidden = true; return; }
    var fw = f.clientWidth, fh = f.clientHeight;
    var s = Math.min(fw / sl.iw, fh / sl.ih);
    var ox = (fw - sl.iw * s) / 2;
    line.style.left = (ox + sl.px * sl.iw * s) + 'px';
    line.hidden = false;
  }

  function setStatus(k, t) { col(k).querySelector('.st').textContent = t; }

  function updateMake() {
    document.getElementById('makeBtn').disabled = !(slots.a.img && slots.b.img);
  }

  function setPhoto(k, file) {
    if (!file || !/^image\//.test(file.type)) return;
    var sl = slots[k], c = col(k), img = c.querySelector('img');
    if (sl.url) URL.revokeObjectURL(sl.url);
    sl.url = URL.createObjectURL(file);
    sl.px = null; sl.img = null;
    var tok = sl.tok = (sl.tok || 0) + 1;
    img.src = sl.url; img.hidden = false;
    c.querySelector('.empty').hidden = true;
    c.querySelector('.plumb').hidden = true;
    document.getElementById('result').hidden = true;
    var im = new Image(); im.src = sl.url;
    im.decode().then(function () {
      if (tok !== sl.tok) return;
      sl.img = im; sl.iw = im.naturalWidth; sl.ih = im.naturalHeight;
      updateMake();
      setStatus(k, '縦線を引いています…');
      jobs = jobs.then(function () {
        if (tok !== sl.tok) return;
        return ensureModel().then(function () { return window.PoseCore.detect(im); }).then(function (kp) {
          if (tok !== sl.tok) return;
          sl.px = plumbX(kp);
          setStatus(k, sl.px == null ? '足元が見つかりませんでした' : '');
          placeLine(k);
        }).catch(function () { if (tok === sl.tok) setStatus(k, '読み込めませんでした'); });
      });
    }).catch(function () { setStatus(k, 'この画像は読み込めませんでした'); });
  }

  ['a', 'b'].forEach(function (k) {
    var c = col(k);
    var cam = c.querySelector('[data-role="cam"]'), file = c.querySelector('[data-role="file"]');
    c.querySelector('[data-role="shoot"]').addEventListener('click', function () { cam.click(); });
    c.querySelector('[data-role="pick"]').addEventListener('click', function () { file.click(); });
    [cam, file].forEach(function (inp) {
      inp.addEventListener('change', function () { setPhoto(k, inp.files[0]); inp.value = ''; });
    });
  });
  window.addEventListener('resize', function () { placeLine('a'); placeLine('b'); });

  /* 書き出し：Before / After を横に並べた1枚 */
  document.getElementById('makeBtn').addEventListener('click', function () {
    var W = 900, H = 1200, G = 24, P = 32;
    var cv = document.createElement('canvas');
    cv.width = P * 2 + W * 2 + G; cv.height = P * 2 + H;
    var c = cv.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, cv.width, cv.height);
    ['a', 'b'].forEach(function (k, i) {
      var sl = slots[k], x = P + i * (W + G), y = P;
      c.fillStyle = '#f2f4f4'; c.fillRect(x, y, W, H);
      var s = Math.min(W / sl.iw, H / sl.ih), dw = sl.iw * s, dh = sl.ih * s;
      var ix = x + (W - dw) / 2, iy = y + (H - dh) / 2;
      c.drawImage(sl.img, ix, iy, dw, dh);
      if (sl.px != null) {
        var lx = ix + sl.px * dw;
        c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(lx - 3, y, 6, H);
        c.fillStyle = '#19c37d'; c.fillRect(lx - 2, y, 4, H);
      }
      c.font = '700 40px ' + getComputedStyle(document.body).fontFamily;
      var tw = c.measureText(sl.label).width;
      c.fillStyle = 'rgba(30,30,30,0.72)'; c.fillRect(x + 24, y + 24, tw + 40, 64);
      c.fillStyle = '#ffffff'; c.textBaseline = 'middle'; c.fillText(sl.label, x + 44, y + 57);
    });
    var out = document.getElementById('out');
    out.src = cv.toDataURL('image/jpeg', 0.92);
    document.getElementById('result').hidden = false;
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
